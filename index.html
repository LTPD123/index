<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나를 소개하는 프로필 카드</title>
  <style>
    /* 기본 여백 초기화 및 박스 모델 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 1. 화면 정중앙 배치 및 4. 보라색 그라데이션 배경 */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 20px;
    }

    /* 1. 흰색 둥근 카드 스타일 */
    .profile-card {
      background-color: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    /* 3. 카드 상단 큰 원형 이미지 플레이스홀더 (회색 동그라미) */
    .profile-avatar {
      width: 120px;
      height: 120px;
      background-color: #d1d5db;
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #6b7280;
      font-size: 14px;
      font-weight: 500;
      border: 4px solid #f3f4f6;
    }

    /* 2. 이름 및 5. 마우스 호버 시 색상 변경 효과 */
    .profile-name {
      font-size: 26px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 10px;
      display: inline-block;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .profile-name:hover {
      color: #764ba2;
    }

    /* 2. 한 줄 소개 */
    .profile-bio {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    /* 2. 좋아하는 것 3가지 리스트 */
    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: left;
    }

    .favorites-item {
      background-color: #f9fafb;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .favorites-item:hover {
      background-color: #f3f4f6;
      transform: translateY(-2px);
    }

    .emoji {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <main class="profile-card">
    <!-- 원형 이미지 플레이스홀더 -->
    <div class="profile-avatar">사진 영역</div>

    <!-- 이름 -->
    <h1 class="profile-name">최재하</h1>

    <!-- 한 줄 소개 -->
    <p class="profile-bio">새로운 아이디어를 코드로 구현하는 것을 좋아하는 개발자입니다.</p>

    <!-- 좋아하는 것 3가지 -->
    <ul class="favorites-list">
      <li class="favorites-item">
        <span class="emoji">🥖</span>
        <span>바게트</span>
      </li>
      <li class="favorites-item">
        <span class="emoji">🧋</span>
        <span>자몽에이드</span>
      </li>
      <li class="favorites-item">
        <span class="emoji">🍨</span>
        <span>요구르트 아이스크림</span>
      </li>
    </ul>
  </main>

</body>
</html>
